# =========================================================
# Configuration pour l'environnement de Test (H2 en mémoire)
# =========================================================

# Connexion H2 en mémoire avec compatibilité MySQL
spring.datasource.url=jdbc:h2:mem:ecommerce_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration Hibernate / JPA pour H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Ne pas exécuter les scripts initiaux SQL
spring.sql.init.mode=never
